spring:
  application:
    name: finlog

  # 데이터소스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/finlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create  # 개발 중에는 create, 나중에 validate로 변경
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # OAuth2 설정 (나중에 발급받은 키로 채울 자리)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
        # Google은 Spring Security가 기본으로 provider 정보를 알고 있어요. 근데 Naver는 Spring Security가 모르는 서비스라서 인증 서버 URL을 직접 알려줘야 해요.
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# JWT 설정
jwt:
  secret: ${JWT_SECRET}

  access-token-expiration: 1800000    # 30분 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# 로깅 설정
logging:
  level:
    com.finance.finlog: DEBUG
    org.hibernate.SQL: DEBUG

data:
  redis:
    host: localhost
    port: 6379